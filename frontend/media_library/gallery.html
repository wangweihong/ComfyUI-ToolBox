<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>Media Library · 素材库</title></head>
<body>
<header><div class="brand"><span class="brand-icon">▦</span><div><strong>素材库</strong><small>MEDIA LIBRARY</small></div></div><div class="search-wrap"><span>⌕</span><input id="search" type="search" placeholder="搜索文件名、路径、提示词和文本…" aria-label="搜索素材"></div><button id="upload" title="上传到 input/toolbox/media-library">↑ 上传素材</button><input id="upload-files" type="file" multiple hidden><button id="scan">↻ 刷新索引</button><button id="settings">目录设置</button></header>
<div class="shell">
<aside class="sidebar"><div class="eyebrow">资料库</div><button id="all" class="nav active">▦ 素材目录</button><button id="recent" class="nav">◷ 最近使用 <span>20</span></button><div class="section-heading"><span class="eyebrow">文件位置</span><button id="add-root" title="添加素材目录">＋</button></div><nav id="roots"></nav><div class="sidebar-bottom"><div id="tools"></div><div id="scan-status" role="status">正在连接素材库…</div></div></aside>
<main><div class="main-heading"><div><div id="breadcrumb" class="eyebrow">所有位置</div><h1 id="view-title">素材目录 <span id="count"></span></h1></div><div class="list-actions"><button id="parent" hidden>↑ 上一级</button><button id="rename-folder" hidden>重命名目录</button><button id="multi-select" aria-pressed="false" hidden>多选</button><button id="prune" hidden>清除失效记录</button></div></div>
<div class="scope-controls"><span id="scope-hint">选择目录后才加载文件</span><label><input id="recursive" type="checkbox" disabled> 包含子目录（平铺）</label></div>
<div class="filters"><div id="types" class="types" role="group" aria-label="文件类型"></div><div class="sort"><select id="sort" aria-label="排序字段"><option value="time">修改时间</option><option value="name">文件名称</option><option value="size">文件大小</option></select><button id="direction" aria-label="切换排序方向">↓</button></div></div>
<div id="bulk" class="bulk" hidden><label><input type="checkbox" id="select-page"> 全选已加载</label><span id="selection-count"></span><button id="bulk-rename">重命名</button><button id="bulk-move">移动</button><button id="bulk-delete" class="danger">删除</button><button id="clear-selection" class="quiet">取消选择</button></div>
<div id="grid" class="grid" aria-live="polite"></div><div class="load-more"><button id="from-start" hidden>从目录开头浏览</button><button id="more" hidden>加载更多</button><span id="paging"></span></div></main>
</div><dialog id="detail-dialog" class="viewer-dialog" aria-label="素材详情"><aside id="detail" class="detail"><div class="empty-detail"><span>▧</span><h2>查看素材详情</h2></div></aside></dialog>
<dialog id="generation-dialog" class="generation-dialog" aria-label="生成信息"><div class="dialog-head"><div><h2>生成信息</h2><p id="generation-file" class="muted"></p></div><div class="generation-tools"><button id="show-all-info">查看所有信息</button><button id="copy-generation">复制所有信息</button><button id="generation-close" data-close="generation-dialog" aria-label="关闭生成信息">×</button></div></div><div id="generation-content"></div></dialog>
<dialog id="json-dialog" class="json-dialog" aria-label="所有信息 JSON"><div class="dialog-head"><div><h2>所有信息 · JSON</h2><p id="json-file" class="muted"></p></div><div class="json-tools"><button id="json-expand">展开一级</button><button id="json-collapse">折叠全部</button><button id="json-copy">复制所有信息</button><button data-close="json-dialog" class="json-close" aria-label="关闭所有信息">×</button></div></div><div id="json-tree" class="json-tree" role="region" aria-label="JSON 数据结构"></div></dialog>
<div id="asset-context-menu" class="asset-context-menu" role="menu" aria-label="素材操作" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
<dialog id="settings-dialog"><div class="dialog-head"><h2>素材目录</h2><button data-close="settings-dialog" aria-label="关闭">×</button></div><p class="muted">填写 ComfyUI 服务器上的绝对目录。所有操作直接作用于原文件。</p><div id="root-settings"></div><form id="root-form"><label>目录名称<input name="name" placeholder="例如：视频素材"></label><label>绝对路径<input name="path" required placeholder="/mnt/media 或 D:\\Media"></label><button type="submit" class="primary">添加目录并建立索引</button><p id="root-error" class="error"></p></form></dialog>
<dialog id="operation-dialog"><div class="dialog-head"><h2 id="operation-title">文件操作</h2><button data-close="operation-dialog" aria-label="关闭">×</button></div><p id="operation-description" class="muted"></p><div id="operation-fields"></div><button id="plan-operation">预览重命名结果</button><div id="operation-list" class="operation-list"></div><div class="dialog-actions"><button id="operation-cancel" data-close="operation-dialog">取消</button><button id="apply-operation" class="primary" hidden>执行清单</button></div></dialog>
<dialog id="folder-rename-dialog" aria-label="重命名目录"><div class="dialog-head"><h2>重命名目录</h2><button data-close="folder-rename-dialog" aria-label="关闭目录重命名">×</button></div><p id="folder-rename-path" class="muted folder-path"></p><p class="muted">修改磁盘上的目录名称，同步更新子素材路径，保留素材 ID。已有同名目标时不会覆盖。</p><form id="folder-rename-form"><label>新目录名称<input id="folder-name" required autocomplete="off" autofocus></label><p id="folder-rename-error" class="error" role="alert"></p><div class="dialog-actions"><button type="button" data-close="folder-rename-dialog">取消</button><button type="submit" id="folder-rename-submit" class="primary">确认重命名</button></div></form></dialog>
<script type="module" src="/gallery.ts"></script></body></html>
